<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Sky Dive Dan</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>

      <div id="hud" hidden>
        <span><span data-i18n="coins">Coins</span> <b id="hud-coins">0</b></span>
        <span><span data-i18n="best">Best</span> <b id="hud-best">0</b></span>
        <span><span data-i18n="alt">Alt</span> <b id="hud-alt">0</b></span>
      </div>

      <button id="pause-btn" class="icon-btn" data-i18n-aria="pause" aria-label="Pause" hidden>
        <span class="pause-glyph" aria-hidden="true"></span>
      </button>
      <!-- Touch joystick: ◀ ▶ steer, push ▲ to fart (proportional past a threshold). -->
      <div id="stick" class="stick" role="group" data-i18n-aria="stick" aria-label="Joystick" hidden>
        <span class="stick-arrow stick-left" aria-hidden="true">◀</span>
        <span class="stick-arrow stick-right" aria-hidden="true">▶</span>
        <span class="stick-arrow stick-up" aria-hidden="true">💨<br />▲</span>
        <span class="stick-knob" aria-hidden="true"></span>
      </div>

      <section id="intro" class="screen">
        <h1 class="title-wrap">
          <img draggable="false" id="title-logo" class="title-logo" src="./assets/title-logo-v01-256.png" alt="Sky Dive Dan" />
          <span id="title-fallback" class="title" hidden>Sky Dive<br />Dan</span>
        </h1>
        <button id="begin-btn" class="big-btn" data-i18n="begin">Begin Game</button>
        <div class="toggles"><button class="lang-btn"><span class="lang-vn">VN</span> / <span class="lang-en">EN</span></button><button class="sound-btn" data-i18n-aria="sound" aria-label="Sound on/off">🔊</button></div>
        <div class="controls">
          <section class="controls-group">
            <h3 data-i18n="ctlComputer">Computer</h3>
            <dl>
              <dt data-i18n="ctlSteer">Steer</dt>
              <dd data-i18n="ctlKeysSteer">← → or A / D</dd>
              <dt data-i18n="ctlFart">Fart boost</dt>
              <dd data-i18n="ctlKeysFart">hold W, ↑ or Space</dd>
            </dl>
          </section>
          <section class="controls-group">
            <h3 data-i18n="ctlMobile">Mobile</h3>
            <dl>
              <dt data-i18n="ctlSteer">Steer</dt>
              <dd data-i18n="ctlTouchSteer">drag left or right</dd>
              <dt data-i18n="ctlFart">Fart boost</dt>
              <dd data-i18n="ctlTouchFart">hold 💨</dd>
            </dl>
          </section>
        </div>
      </section>

      <section id="paused" class="screen" hidden>
        <h2 class="title-wrap">
          <img draggable="false" class="title-logo title-logo-wide logo-en-only" src="./assets/paused-logo-v01-256.png" alt="Paused" />
          <span class="title" data-i18n="paused" hidden>Paused</span>
        </h2>
        <button id="resume-btn" class="big-btn" data-i18n="resume">Resume</button>
        <button id="restart-btn" class="big-btn secondary" data-i18n="restart">Restart</button>
        <div class="toggles"><button class="lang-btn"><span class="lang-vn">VN</span> / <span class="lang-en">EN</span></button><button class="sound-btn" data-i18n-aria="sound" aria-label="Sound on/off">🔊</button></div>
      </section>

      <section id="gameover" class="screen" hidden>
        <h2 class="title-wrap">
          <img draggable="false" class="title-logo" src="./assets/game-over-logo-v01-256.png" alt="GAME OVER" />
          <span class="title" data-i18n="gameOver" hidden>GAME OVER</span>
        </h2>
        <p><span data-i18n="coins">Coins</span>: <b id="final-score">0</b></p>
        <p><span data-i18n="best">Best</span>: <b id="final-best">0</b></p>
        <p id="new-best" class="new-best" data-i18n="newBest" hidden>New best!</p>
        <button id="again-btn" class="big-btn" data-i18n="playAgain">Play again</button>
        <div class="toggles"><button class="lang-btn"><span class="lang-vn">VN</span> / <span class="lang-en">EN</span></button><button class="sound-btn" data-i18n-aria="sound" aria-label="Sound on/off">🔊</button></div>
      </section>

      <!-- Share QR (start, pause, game-over screens): tap to enlarge, tap again to shrink. -->
      <button id="qr-btn" class="qr-btn" data-i18n-aria="share" aria-label="Show QR code to share" aria-expanded="false"></button>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
