# Deploy the static site to GitHub Pages on every push to main.
# No build step: the repo root is served as-is (native ES modules, relative paths).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest push deploys; an in-progress deploy is cancelled by a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Publish only what the game needs: no docs, editor config, or the
      # full-resolution source art in assets/originals/ (never loaded).
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html styles.css _site/
          cp -r src _site/
          if [ -d assets ]; then cp -r assets _site/ && rm -rf _site/assets/originals; fi

      # Requires Settings → Pages → Source: "GitHub Actions" (one-time setup).
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
