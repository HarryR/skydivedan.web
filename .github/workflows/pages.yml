# Deploy the static site to GitHub Pages on every push to main.
# tools/build.sh bundles + minifies src/ into _site/game.js with a standalone
# esbuild binary (no npm); locally the unbundled modules are served as-is.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest push deploys; an in-progress deploy is cancelled by a newer one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Pinned standalone esbuild binary, fetched straight from the registry tarball.
      - name: Install esbuild
        run: |
          mkdir -p "$RUNNER_TEMP/esbuild"
          curl -fsSL https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-0.20.1.tgz \
            | tar -xz -C "$RUNNER_TEMP/esbuild" --strip-components=2 package/bin/esbuild
          echo "$RUNNER_TEMP/esbuild" >> "$GITHUB_PATH"

      # Publish only what the game needs (see tools/build.sh): the bundled JS,
      # no docs, editor config, or full-resolution art in assets/originals/.
      - name: Build site
        run: tools/build.sh

      # Requires Settings → Pages → Source: "GitHub Actions" (one-time setup).
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
